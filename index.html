<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat &amp; Flow Studio</title>
<meta name="description" content="Beat & Flow Studio makes simple, fast translator apps for Android.">
<link rel="icon" href="vertalen-cevir.png">
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #141b26;
    --muted: #677385;
    --line: #e4e7ec;
    --accent: #1d2a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e131b;
      --card: #161d28;
      --text: #eef1f5;
      --muted: #8b96a8;
      --line: #252e3c;
      --accent: #eef1f5;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: 96px 24px 48px;
  }
  .brand {
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
  }
  h1 {
    font-size: clamp(32px, 7vw, 44px);
    line-height: 1.1;
    letter-spacing: -.02em;
    font-weight: 650;
    margin: 0 0 16px;
  }
  .lead { color: var(--muted); margin: 0 0 56px; font-size: 18px; }
  .app {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    text-decoration: none;
    color: inherit;
    transition: transform .15s ease, border-color .15s ease;
  }
  .app:hover { transform: translateY(-2px); border-color: var(--muted); }
  .app img { width: 64px; height: 64px; border-radius: 15px; flex: none; }
  .app strong { display: block; font-size: 18px; font-weight: 600; }
  .app span { color: var(--muted); font-size: 14px; }
  .app .arrow { margin-left: auto; color: var(--muted); font-size: 20px; }
  .links { margin: 20px 4px 0; font-size: 14px; color: var(--muted); }
  .links a { color: var(--accent); text-underline-offset: 3px; }
  footer {
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
    padding: 24px;
    font-size: 13px;
    color: var(--muted);
  }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <p class="brand">Beat &amp; Flow Studio</p>
  <h1>Simple translators,<br>made with care.</h1>
  <p class="lead">Fast, clean translation apps for Android.</p>

  <a class="app" href="https://play.google.com/store/apps/details?id=com.beatnflowstudio.dutch_turkish_translator">
    <img src="vertalen-cevir.png" alt="Vertalen Çevir app icon">
    <div>
      <strong>Vertalen Çevir</strong>
      <span>Dutch ⇄ Turkish · Google Play</span>
    </div>
    <span class="arrow" aria-hidden="true">→</span>
  </a>
  <p class="links"><a href="https://sites.google.com/view/privacy-vertalen-cevir/home">Privacy policy</a></p>
</main>
<footer>
  © 2026 Beat &amp; Flow Studio · <a href="mailto:hederland1024@gmail.com">hederland1024@gmail.com</a>
</footer>
</body>
</html>
